# Daily score snapshot in the competition repo (next to kflow.toml).
# Repository secret: KAGGLE_API_TOKEN
# Pin wuisabel-gif/kaggle-workflow@v1 after the first GitHub release.
name: track

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wuisabel-gif/kaggle-workflow@v1
        with:
          kaggle-api-token: ${{ secrets.KAGGLE_API_TOKEN }}
          commit: true
