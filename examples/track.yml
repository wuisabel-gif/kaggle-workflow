# Copy to .github/workflows/track.yml in the competition repo (next to kflow.toml).
# Records every submission's score once a day and commits ratings.csv.
# Needs repository secret KAGGLE_API_TOKEN; kflow must be installable from git.
name: track

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "kflow @ git+https://github.com/OWNER/kaggle-workflow"
      - run: kflow status --record
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      - name: Commit ratings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .kflow/ratings.csv
          git diff --cached --quiet || git commit -m "Record submission scores $(date -u +%F)"
          git push
