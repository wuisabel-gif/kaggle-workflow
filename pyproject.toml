[project]
name = "kflow"
version = "0.2.1"
description = "Submit, track and study agents in Kaggle simulation competitions"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Isabel Wu" }]
requires-python = ">=3.11"
keywords = ["kaggle", "simulation", "agents", "github-actions"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["kaggle>=2.0"]

[project.optional-dependencies]
sim = ["kaggle-environments"]

[project.urls]
Homepage = "https://github.com/wuisabel-gif/kaggle-workflow"
Issues = "https://github.com/wuisabel-gif/kaggle-workflow/issues"
Changelog = "https://github.com/wuisabel-gif/kaggle-workflow/blob/main/CHANGELOG.md"

[project.scripts]
kflow = "kflow:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["kflow"]
